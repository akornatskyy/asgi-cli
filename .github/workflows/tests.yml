name: tests

on: [push, pull_request]

jobs:
  tests:
    name: "${{ matrix.tox }}"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            tox: py311
          - python: "3.12"
            tox: py312
          - python: "3.13"
            tox: py313
          - python: "3.14"
            tox: py314
          - python: "3.15"
            tox: py315
          - python: "pypy-3.12"
            tox: pypy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python }}"
      - run: |
          python -m pip install --upgrade pip
          pip install tox coveralls
      - run: tox -e ${{ matrix.tox }}
      - env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        if: ${{ env.COVERALLS_REPO_TOKEN }}
        run: coveralls
  qa:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: |
          python -m pip install --upgrade pip
          pip install tox
      - run: tox -e lint

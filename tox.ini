[tox]
envlist = py3{0,1,2,3,4},pypy3,lint

[testenv]
usedevelop = True
deps =
  -r requirements/dev.txt
commands =
  coverage run -m pytest --doctest-modules -q -x src
  coverage report -m
  python -masgi_cli.main example:app
  python -masgi_cli.main -v example:app
  python -masgi_cli.main -b example:app

[testenv:lint]
skip_install = True
deps =
  autoflake
  black
  flake8
  flake8-bugbear
  flake8-import-order
  flake8-mutable
  isort
  mypy
  pep8-naming
commands =
  autoflake --in-place --remove-unused-variables --remove-all-unused-imports \
    --recursive src/ example.py
  isort --profile black --combine-as --case-sensitive src/ example.py
  black -ql79 src/ example.py
  mypy --strict --show-error-codes src/
  flake8 src/ example.py

[flake8]
show-source = True
max-complexity = 8
# Codes: http://flake8.pycqa.org/en/latest/user/error-codes.html
ignore =
  # missing whitespace after ','
  E231,
